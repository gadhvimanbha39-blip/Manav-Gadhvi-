
<!DOCTYPE html>
<html>
<head>
  <title>Manav Gadhvi Store</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: black;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
    }

    .product {
      background: white;
      width: 200px;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px;
      background: green;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>
  Manav Gadhvi Deals Store
</header>

<div class="container">

  <!-- PRODUCT 1 -->
  <div class="product">
    <img src="https://m.media-amazon.com/images/I/71example1.jpg">
    <h3>Stylish T-Shirt</h3>
    <p>₹499</p>
    <a class="btn" href="https://amzn.to/example1" target="_blank">Buy Now</a>
  </div>

  <!-- PRODUCT 2 -->
  <div class="product">
    <img src="https://m.media-amazon.com/images/I/71example2.jpg">
    <h3>Casual Shirt</h3>
    <p>₹699</p>
    <a class="btn" href="https://amzn.to/example2" target="_blank">Buy Now</a>
  </div>

</div>

</body>
</html>
